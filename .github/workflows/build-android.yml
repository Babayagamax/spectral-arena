name: Build Android app (Play Store)

# Builds the signed Play Store app (.aab) entirely in the cloud — no computer needed.
# Requires these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  — the base64 text of spectral-arena-upload-key.p12
#   KSTORE_PWD       — the keystore password
#   KEY_ALIAS        — spectralarena
#   KEY_PWD          — the keystore password (same value as KSTORE_PWD)
#
# Run it: Actions tab → "Build Android app (Play Store)" → Run workflow.
# The finished app appears under Releases as app-release.aab.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icons
        run: npx capacitor-assets generate --android

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > upload-key.p12

      - name: Add signing config to the app
        run: |
          python3 - <<'EOF'
          p = 'android/app/build.gradle'
          s = open(p).read()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("../../upload-key.p12")
                      storeType "PKCS12"
                      storePassword System.getenv("KSTORE_PWD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PWD")
                  }
              }
          '''
          s = s.replace('android {', 'android {' + signing, 1)
          s = s.replace(
              'buildTypes {',
              'buildTypes {\n'
              '            release {\n'
              '                signingConfig signingConfigs.release\n'
              '            }\n',
              1)
          open(p, 'w').write(s)
          print('patched android/app/build.gradle')
          EOF

      - name: Build release bundle (.aab)
        env:
          KSTORE_PWD: ${{ secrets.KSTORE_PWD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PWD: ${{ secrets.KEY_PWD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Verify the bundle is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          unzip -l "$AAB" | grep -i "META-INF" | head -5

      - name: Publish as a GitHub Release (easy download on tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            android/app/build/outputs/bundle/release/app-release.aab \
            --title "Spectral Arena $TAG" \
            --notes "Play Store build. Download app-release.aab, then upload it in Play Console → Release → Production." \
            --repo "$GITHUB_REPOSITORY"

      - name: Also upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: spectral-arena-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
